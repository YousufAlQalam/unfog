<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#1d2124">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Unfog Damascus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  :root{
    --bg:#1d2124; --panel:#262b2f; --panel2:#2f3539; --line:rgba(255,255,255,.07);
    --gold:#d6b98c; --gold2:#e8d3ae; --text:#ece8e1; --muted:#9a9e9c; --ok:#8fbf9a; --bad:#d98f84;
    --navh:64px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Cairo,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
  button{font:inherit;border:none;cursor:pointer;color:inherit;background:none}
  #map{position:absolute;inset:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom));background:#23282b}
  .leaflet-control-attribution{background:rgba(29,33,36,.6)!important;color:#9aa!important;font-size:9px}
  .leaflet-control-attribution a{color:#cdd!important}

  /* top HUD */
  #hud{position:absolute;top:calc(env(safe-area-inset-top) + 10px);left:10px;right:10px;z-index:1000;display:flex;gap:8px;pointer-events:none}
  .glass{background:rgba(38,43,47,.92);border:1px solid rgba(214,185,140,.22);border-radius:16px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);pointer-events:auto}
  #lvl{flex:1;padding:7px 12px}
  #lvlTitle{font-weight:800;color:var(--gold);font-size:14px;line-height:1.2}
  #lvlSub{font-size:11px;color:var(--muted)}
  #bar{height:5px;background:#353b3f;border-radius:3px;margin-top:4px;overflow:hidden}
  #bar>div{height:100%;width:0;background:linear-gradient(90deg,#a8875a,var(--gold2));transition:width .5s}
  #gps{padding:7px 10px;font-size:11px;display:flex;align-items:center;gap:5px;white-space:nowrap}
  #gps i{width:9px;height:9px;border-radius:50%;background:#6b7073;display:inline-block}

  /* right tools */
  #tools{position:absolute;right:10px;top:calc(env(safe-area-inset-top) + 72px);z-index:1000;display:flex;flex-direction:column;gap:8px}
  .tool{width:44px;height:44px;border-radius:14px;font-size:19px;display:flex;align-items:center;justify-content:center}
  .tool.off{opacity:.45}

  /* walk button + live chip */
  #walkWrap{position:absolute;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 14px);z-index:1000;display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
  #walkBtn{pointer-events:auto;background:linear-gradient(135deg,#e6cfa6,#c9a46c);color:#2b2214;font-weight:800;font-size:15px;padding:13px 26px;border-radius:30px;box-shadow:0 8px 24px rgba(201,164,108,.28)}
  #walkBtn.on{background:linear-gradient(135deg,#b9dcc1,#7fae8b);color:#13261a;box-shadow:0 8px 24px rgba(143,191,154,.28)}
  #live{pointer-events:auto;display:none;padding:6px 14px;font-size:12px;font-weight:700}
  #live.show{display:block}

  /* bottom nav */
  #nav{position:absolute;left:0;right:0;bottom:0;height:calc(var(--navh) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#1a1e21;border-top:1px solid var(--line);display:flex;z-index:1500}
  #nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;color:var(--muted);font-weight:600}
  #nav button b{font-size:21px;font-weight:400;filter:grayscale(.6);opacity:.8}
  #nav button.act{color:var(--gold)}
  #nav button.act b{filter:none;opacity:1}

  /* pages */
  .page{position:absolute;left:0;right:0;top:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom));background:var(--bg);z-index:1200;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 16px) 14px 24px;display:none}
  .page.show{display:block}
  .page h1{font-size:22px;margin:0 0 4px;font-weight:800}
  .page .lead{color:var(--muted);font-size:13px;margin:0 0 14px}
  .chips{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
  .chip{padding:6px 12px;border-radius:20px;background:var(--panel);border:1px solid var(--line);font-size:12px;white-space:nowrap;font-weight:600}
  .chip.act{background:var(--gold);color:#2b2214;border-color:var(--gold)}

  .pcard{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px;margin-bottom:10px;align-items:center}
  .pcard .th{width:74px;height:74px;border-radius:12px;flex:none;background:#343a3e center/cover no-repeat;display:flex;align-items:center;justify-content:center;font-size:28px;position:relative}
  .pcard .th .ok{position:absolute;right:-4px;top:-4px;background:var(--ok);color:#13261a;border-radius:50%;width:22px;height:22px;font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:800}
  .pcard .tx{flex:1;min-width:0}
  .pcard .nm{font-weight:700;font-size:15px;line-height:1.25}
  .pcard .ar{font-size:12px;color:var(--muted)}
  .pcard .meta{font-size:11px;color:var(--muted);margin-top:3px}
  .prog{height:4px;background:#353b3f;border-radius:2px;margin-top:6px;overflow:hidden}
  .prog>div{height:100%;background:var(--gold)}

  /* stats */
  .ring{display:flex;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:14px;margin-bottom:12px}
  .ring svg{flex:none}
  .ring .big{font-size:26px;font-weight:800;color:var(--gold);line-height:1}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
  .tile{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:12px}
  .tile .v{font-size:22px;font-weight:800}
  .tile .k{font-size:11px;color:var(--muted)}
  .catrow{display:flex;align-items:center;gap:10px;margin:8px 0;font-size:13px}
  .catrow .cb{flex:1;height:8px;background:#353b3f;border-radius:4px;overflow:hidden}
  .catrow .cb>div{height:100%}
  .sec{font-size:15px;font-weight:800;margin:18px 0 8px}
  .walkrow{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;font-size:13px}
  .walkrow small{color:var(--muted)}

  /* gallery */
  .gal{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
  .gal img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:6px;display:block}
  .galhead{font-size:13px;font-weight:700;margin:14px 0 6px;color:var(--gold)}
  .empty{text-align:center;color:var(--muted);padding:40px 20px;font-size:14px}
  .empty b{display:block;font-size:40px;margin-bottom:8px}

  /* sheet */
  #scrim{position:absolute;inset:0;background:rgba(0,0,0,.5);z-index:2500;display:none}
  #scrim.open{display:block}
  #sheet{position:absolute;left:0;right:0;bottom:0;z-index:3000;background:var(--panel);border-radius:22px 22px 0 0;max-height:88vh;overflow-y:auto;transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);box-shadow:0 -12px 40px rgba(0,0,0,.6);padding-bottom:calc(env(safe-area-inset-bottom) + 16px)}
  #sheet.open{transform:none}
  .grab{width:40px;height:4px;border-radius:2px;background:#454c51;margin:8px auto 0}
  .sh{padding:12px 16px 0}
  .sh h2{margin:0;font-size:20px;font-weight:800;line-height:1.2}
  .sh .ar{color:var(--muted);font-size:15px;direction:rtl;text-align:left}
  .sh p{font-size:14px;line-height:1.65;color:#d3d9e6;margin:8px 0}
  .badges{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
  .badge{font-size:12px;padding:4px 10px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-weight:600}
  .carousel{display:flex;gap:6px;overflow-x:auto;scroll-snap-type:x mandatory;padding:0 16px;margin-top:10px}
  .carousel img{height:190px;border-radius:14px;scroll-snap-align:center;flex:none;max-width:85%;object-fit:cover;background:#343a3e}
  .hero{height:150px;margin:10px 16px 0;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:56px}
  .shot{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;background:var(--panel2);margin:6px 0}
  .shot .ck{width:26px;height:26px;border-radius:50%;border:2px solid #5a6166;flex:none;display:flex;align-items:center;justify-content:center;font-size:13px}
  .shot.done .ck{background:var(--ok);border-color:var(--ok);color:#13261a;font-weight:800}
  .shot .t{flex:1;font-size:13px}
  .shot img{width:44px;height:44px;border-radius:8px;object-fit:cover}
  .shot button{background:var(--gold);color:#2b2214;font-weight:800;padding:7px 10px;border-radius:10px;font-size:12px}
  .shot button:disabled{background:#454c51;color:#8d9295}
  .tip{background:rgba(214,185,140,.08);border:1px solid rgba(214,185,140,.25);border-radius:12px;padding:10px 12px;font-size:13px;margin:10px 0;line-height:1.55}
  .row{display:flex;gap:8px;margin-top:12px}
  .btn{flex:1;padding:12px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-weight:700;font-size:14px;text-align:center;text-decoration:none;color:var(--text);display:block}
  .btn.pri{background:var(--gold);color:#2b2214;border-color:var(--gold)}
  .btn.danger{color:var(--bad)}
  .lnk{color:var(--gold);font-size:13px;text-decoration:none;font-weight:600}
  label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;font-weight:600}
  input.f,select.f{width:100%;background:#1a1e21;border:1px solid #3a4146;color:var(--text);border-radius:12px;padding:11px 12px;font:inherit;font-size:15px}
  .seg{display:flex;gap:6px;flex-wrap:wrap}
  .seg button{padding:7px 11px;border-radius:12px;background:#1a1e21;border:1px solid #3a4146;font-size:13px}
  .seg button.act{background:var(--gold);color:#2b2214;border-color:var(--gold);font-weight:700}

  /* summary */
  .sumgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
  .sumgrid div{background:var(--panel2);border-radius:12px;padding:10px;text-align:center}
  .sumgrid b{display:block;font-size:19px;color:var(--gold)}
  .sumgrid span{font-size:11px;color:var(--muted)}

  /* viewer */
  #viewer{position:absolute;inset:0;background:rgba(5,8,16,.96);z-index:4000;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}
  #viewer.open{display:flex}
  #viewer img{max-width:100%;max-height:72vh;border-radius:12px}
  #viewer .cap{margin-top:12px;text-align:center;font-size:14px}
  #viewer .cap small{display:block;color:var(--muted)}
  #viewer .vnav{display:flex;gap:10px;margin-top:14px;width:100%;max-width:360px}

  /* toast */
  #toast{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 74px);transform:translate(-50%,-16px);z-index:5000;background:var(--gold);color:#2b2214;font-weight:800;padding:10px 16px;border-radius:14px;opacity:0;transition:all .35s;pointer-events:none;text-align:center;max-width:88%;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.4)}
  #toast.show{opacity:1;transform:translate(-50%,0)}

  /* markers */
  .pin{display:flex;flex-direction:column;align-items:center}
  .pin .c{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;background:#2a2f33 center/cover;border:2.5px solid var(--gold);box-shadow:0 3px 10px rgba(0,0,0,.5);position:relative}
  .pin.done .c{border-color:var(--ok);box-shadow:0 0 0 3px rgba(143,191,154,.35),0 3px 10px rgba(0,0,0,.5)}
  .pin.done .c:after{content:"✓";position:absolute;right:-5px;bottom:-3px;background:var(--ok);color:#13261a;font-size:10px;font-weight:900;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .pin.near .c{animation:pulse 1.3s infinite}
  .pin .l{margin-top:3px;font-size:11px;font-weight:700;color:#fff;background:rgba(29,33,36,.82);padding:1px 7px;border-radius:8px;white-space:nowrap;max-width:140px;overflow:hidden;text-overflow:ellipsis}
  .hidelabels .pin .l{display:none}
  @keyframes pulse{0%{box-shadow:0 0 0 0 rgba(214,185,140,.9)}100%{box-shadow:0 0 0 18px rgba(214,185,140,0)}}
  .av{width:36px;height:36px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:19px;flex:none;border:2.5px solid var(--gold);background:#2a2f33}
  .frow{display:flex;align-items:center;gap:10px;padding:10px;background:var(--panel);border:1px solid var(--line);border-radius:14px;margin-bottom:8px}
  .frow .tx{flex:1;font-size:14px}.frow small{display:block;color:var(--muted);font-size:11px}
  .sbox{display:flex;gap:8px;align-items:center}
  .sres{display:flex;gap:10px;align-items:center;padding:10px 6px;border-bottom:1px solid var(--line)}
  .sres .ic{width:34px;height:34px;border-radius:10px;background:var(--panel2);display:flex;align-items:center;justify-content:center;font-size:17px;flex:none}
  .sres .tx{flex:1;min-width:0;font-size:14px}.sres small{display:block;color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  textarea.f{width:100%;background:#1a1e21;border:1px solid #3a4146;color:var(--text);border-radius:12px;padding:11px 12px;font:inherit;font-size:14px;min-height:80px;resize:vertical}
  .fstrip{display:flex;gap:6px;overflow-x:auto;margin:6px 0}
  .fstrip img{width:70px;height:70px;border-radius:10px;object-fit:cover;flex:none}
  #live{cursor:pointer}
  #drawBar{position:absolute;left:10px;right:10px;bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 12px);z-index:1100;padding:10px 12px;display:none}
  #drawBar.show{display:block}
  #placeBar{position:absolute;left:10px;right:10px;bottom:calc(var(--navh) + env(safe-area-inset-bottom) + 12px);z-index:1100;padding:10px 12px;display:none}
  #placeBar.show{display:flex;gap:10px;align-items:center}
  #placeBar img{width:56px;height:56px;border-radius:10px;object-fit:cover;flex:none}
  #placeBar .t{flex:1;font-size:13px;font-weight:700}#placeBar .t small{display:block;color:var(--muted);font-weight:600;font-size:11px}
  .wrow{display:flex;gap:10px;align-items:center;justify-content:center}
  #snapBtn{pointer-events:auto;width:50px;height:50px;border-radius:50%;font-size:22px;display:none;align-items:center;justify-content:center}
  #snapBtn.show{display:flex}
  .rph{width:30px;height:30px;border-radius:9px;border:2px solid #fff;background:#3a4146 center/cover no-repeat;box-shadow:0 2px 8px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;font-size:13px}
  .hidephotos .rph{display:none}
  #drawBar .t{font-size:13px;font-weight:700}
  #drawBar .t small{display:block;color:var(--muted);font-weight:600;font-size:11px}
  .dbtns{display:flex;gap:6px;margin-top:8px}.dbtns .btn{padding:9px}
  .logcard{background:rgba(214,185,140,.08);border:1px dashed rgba(214,185,140,.4);border-radius:14px;padding:12px;margin:10px 0}
  .logcard b{display:block;font-size:14px}.logcard span{font-size:12px;color:var(--muted)}
  .shot .g{background:var(--panel);color:var(--text);border:1px solid var(--line)}
  input[type=date].f{color-scheme:dark}
  .me{width:20px;height:20px;border-radius:50%;background:#4ea3ff;border:3px solid #fff;box-shadow:0 0 0 7px rgba(78,163,255,.25)}
</style>
</head>
<body>
<div id="map"></div>

<div id="hud">
  <div class="glass" id="lvl" data-go="stats">
    <div id="lvlTitle">Lv 1 · Stranger</div>
    <div id="lvlSub">0 XP</div>
    <div id="bar"><div></div></div>
  </div>
  <div class="glass" id="gps"><i id="gpsDot"></i><span id="gpsTxt">GPS off</span></div>
</div>

<div id="tools">
  <button class="glass tool" id="tSearch" title="Search">🔍</button>
  <button class="glass tool" id="tFog" title="Fog">🌫️</button>
  <button class="glass tool" id="tTrail" title="Trails">〰️</button>
  <button class="glass tool" id="tDraw" title="Draw a path">✏️</button>
  <button class="glass tool" id="tMe" title="Center on me">📍</button>
</div>

<div id="walkWrap">
  <div class="glass" id="live"></div>
  <div class="wrow"><button id="walkBtn">▶ Start walk</button><button class="glass" id="snapBtn" title="Photo on route">📷</button></div>
</div>
<div class="glass" id="placeBar">
  <img id="pbImg" alt="">
  <div class="t" id="pbTxt"></div>
  <div style="display:flex;flex-direction:column;gap:6px"><button class="btn" id="pbSkip" style="padding:7px 10px;font-size:12px">Skip</button><button class="btn" id="pbEven" style="padding:7px 10px;font-size:12px">Spread rest</button></div>
</div>

<div class="glass" id="drawBar">
  <div class="t" id="drawTxt">✏️ Tap along the streets you took<small>Each tap adds a point. Follow the streets, not straight across blocks.</small></div>
  <div class="dbtns"><button class="btn" id="dUndo">↶ Undo</button><button class="btn" id="dCancel">Cancel</button><button class="btn pri" id="dSave">Save path</button></div>
</div>

<!-- pages -->
<div class="page" id="pg-places">
  <h1>Places</h1>
  <p class="lead">Long-press anywhere on the map to add your own.</p>
  <div class="chips" id="placeFilters"></div>
  <div id="placeList"></div>
</div>
<div class="page" id="pg-gallery">
  <h1>Gallery</h1>
  <p class="lead">Every shot you've taken, by place.</p>
  <div id="galBody"></div>
</div>
<div class="page" id="pg-stats">
  <h1>Your Damascus</h1>
  <p class="lead" id="statsLead"></p>
  <div id="statsBody"></div>
</div>

<nav id="nav">
  <button data-go="map" class="act"><b>🗺️</b>Map</button>
  <button data-go="places"><b>📍</b>Places</button>
  <button data-go="gallery"><b>🖼️</b>Gallery</button>
  <button data-go="stats"><b>📊</b>Stats</button>
</nav>

<div id="scrim"></div>
<div id="sheet"></div>
<div id="viewer"></div>
<div id="toast"></div>

<input type="file" id="fileEnv" accept="image/*" capture="environment" hidden>
<input type="file" id="fileUser" accept="image/*" capture="user" hidden>
<input type="file" id="fileGal1" accept="image/*" hidden>
<input type="file" id="fileSnap" accept="image/*" capture="environment" hidden>
<input type="file" id="fileRoute" accept="image/*" multiple hidden>
<input type="file" id="fileAlbum" accept="image/*" multiple hidden>
<input type="file" id="fileImport" accept="application/json,.json,text/plain,.txt,.unfog" hidden>

<script>
(() => {
'use strict';

/* ================= Settings ================= */
const CELL = 0.00015;      // ~15 m grid
const REVEAL_M = 45;       // fog cleared around you
const NEAR_M = 150;        // how close to take a place's shots
const MAX_ACC = 60;        // ignore fixes worse than this
const MIN_STEP = 8;        // metres between trail points
const XP = { cell:1, visit:50, shot:20, full:40, album:5 };
const START = [33.5110, 36.3050];

const CATS = {
  heritage:{ n:'Heritage', ic:'🏛️', c:'#d6b98c' },
  faith:   { n:'Faith',    ic:'🕌', c:'#8fa9c4' },
  souq:    { n:'Souqs',    ic:'🛍️', c:'#d49a85' },
  quarter: { n:'Quarters', ic:'🏘️', c:'#a99cc4' },
  food:    { n:'Food',     ic:'🍽️', c:'#c79aa8' },
  views:   { n:'Views',    ic:'⛰️', c:'#9fbf8f' },
  parks:   { n:'Parks',    ic:'🌳', c:'#86b5ab' },
  mine:    { n:'My spots', ic:'⭐', c:'#e0cfa8' }
};
const TIMES = { day:'☀️ Daytime', sunset:'🌅 Golden hour', night:'🌙 Night', any:'🕐 Anytime' };
const TITLES = ['Stranger','Passer-by','Wanderer','Explorer','Pathfinder','Alley Runner','Old City Ranger','Cartographer','Ibn Battuta Jr.','Shaykh al-Hara'];

/* ================= Built-in places ================= */
// Coordinates are approximate; the 150 m radius covers small errors.
const BASE = [

  set(k,v){ try{ localStorage.setItem(k,JSON.stringify(v)); }catch(e){ toast('⚠️ Storage is full. Export a backup.'); } }
};

let db=null;
function openDB(){ return new Promise(res=>{ try{ const r=indexedDB.open('unfog',1); r.onupgradeneeded=()=>r.result.createObjectStore('photos'); r.onsuccess=()=>{db=r.result;res(db)}; r.onerror=()=>res(null);}catch(e){res(null)} }); }
function idb(mode,fn){ return new Promise(res=>{ if(!db) return res(null); try{ const t=db.transaction('photos',mode); const s=t.objectStore('photos'); const r=fn(s); t.oncomplete=()=>res(r&&r.result!==undefined?r.result:true); t.onerror=()=>res(null);}catch(e){res(null)} }); }
const putPhoto=(k,v)=>idb('readwrite',s=>s.put(v,k));
const getPhoto=k=>idb('readonly',s=>s.get(k));
const delPhoto=k=>idb('readwrite',s=>s.delete(k));
function allPhotos(){ return new Promise(res=>{ if(!db) return res({}); const o={}; const q=db.transaction('photos').objectStore('photos').openCursor(); q.onsuccess=e=>{const c=e.target.result; if(c){o[c.key]=c.value;c.continue();} else res(o);}; q.onerror=()=>res(o); }); }
try{ navigator.storage&&navigator.storage.persist&&navigator.storage.persist(); }catch(e){}

/* ================= Helpers ================= */
function debounce(f,ms){ let t; return (...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms);}; }
const $=id=>document.getElementById(id);
function key(a,o){ return Math.round(a/CELL)+','+Math.round(o/CELL); }
function cellCenter(k){ const [a,b]=k.split(',').map(Number); return [a*CELL,b*CELL]; }
function dist(a1,o1,a2,o2){ const R=6371000,r=Math.PI/180,dA=(a2-a1)*r,dO=(o2-o1)*r; const h=Math.sin(dA/2)**2+Math.cos(a1*r)*Math.cos(a2*r)*Math.sin(dO/2)**2; return 2*R*Math.asin(Math.sqrt(h)); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtD(m){ return m<1000? Math.round(m)+' m' : (m/1000).toFixed(m<10000?2:1)+' km'; }
function fmtT(ms){ const m=Math.round(ms/60000); return m<60? m+' min' : Math.floor(m/60)+'h '+(m%60)+'m'; }
function vibrate(p){ try{ navigator.vibrate&&navigator.vibrate(p);}catch(e){} }
let toastT; function toast(m){ const t=$('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2800); }
const places=()=>BASE.concat(custom);
const placeById=id=>places().find(p=>p.id===id);
const shotsDone=p=>p.shots.filter((_,i)=>shots[p.id+'#'+i]).length;
function totalXp(){ let x=cells.size*XP.cell+Object.keys(visits).length*XP.visit+Object.keys(shots).length*XP.shot+Object.keys(album).length*XP.album+Object.keys(rphotos).filter(k=>!rphotos[k].from).length*XP.album; for(const p of places()) if(p.shots.length&&shotsDone(p)===p.shots.length) x+=XP.full; return x; }
function levelInfo(xp){ const need=l=>Math.round(150*Math.pow(l,1.6)); let lv=1,base=0; while(xp>=base+need(lv)){base+=need(lv);lv++;} return {lv,into:xp-base,need:need(lv),title:TITLES[Math.min(lv-1,TITLES.length-1)]}; }
function totalDist(){ return walks.reduce((s,w)=>s+(w.dist||0),0)+(cur?cur.dist:0); }

/* ---- fog ---- */
map.createPane('fog'); map.getPane('fog').style.zIndex=450; map.getPane('fog').style.pointerEvents='none';
map.createPane('trails'); map.getPane('trails').style.zIndex=460; map.getPane('trails').style.pointerEvents='none';
const fog=document.createElement('canvas'); fog.style.position='absolute'; map.getPane('fog').appendChild(fog);
const brush=(()=>{ const c=document.createElement('canvas'); c.width=c.height=128; const g=c.getContext('2d'); const gr=g.createRadialGradient(64,64,0,64,64,64); gr.addColorStop(0,'rgba(0,0,0,1)'); gr.addColorStop(.5,'rgba(0,0,0,1)'); gr.addColorStop(1,'rgba(0,0,0,0)'); g.fillStyle=gr; g.fillRect(0,0,128,128); return c; })();
const clouds=(()=>{ // soft cloud texture, tileable-ish
  const c=document.createElement('canvas'); c.width=c.height=512; const g=c.getContext('2d');
  let s=7; const rnd=()=>{ s=(s*16807)%2147483647; return s/2147483647; };
  for(let i=0;i<70;i++){ const x=rnd()*512,y=rnd()*512,r=40+rnd()*110; for(const dx of [-512,0,512]) for(const dy of [-512,0,512]){ const gr=g.createRadialGradient(x+dx,y+dy,0,x+dx,y+dy,r); const a=.05+rnd()*.07; gr.addColorStop(0,`rgba(232,226,214,${a})`); gr.addColorStop(1,'rgba(232,226,214,0)'); g.fillStyle=gr; g.fillRect(x+dx-r,y+dy-r,r*2,r*2);} }
  return c; })();
function drawFog(){
  const size=map.getSize(), dpr=Math.min(window.devicePixelRatio||1,2);
  fog.width=size.x*dpr; fog.height=size.y*dpr; fog.style.width=size.x+'px'; fog.style.height=size.y+'px';
  L.DomUtil.setPosition(fog,map.containerPointToLayerPoint([0,0]));
  const g=fog.getContext('2d'); g.setTransform(dpr,0,0,dpr,0,0); g.clearRect(0,0,size.x,size.y);
  if(!settings.fog) return;
  g.globalCompositeOperation='source-over';
  const gr=g.createLinearGradient(0,0,size.x*.4,size.y);
  gr.addColorStop(0,'rgba(62,68,72,0.80)'); gr.addColorStop(.55,'rgba(50,55,60,0.78)'); gr.addColorStop(1,'rgba(70,63,58,0.80)');
  g.fillStyle=gr; g.fillRect(0,0,size.x,size.y);
  const o=map.latLngToContainerPoint(START);
  const pat=g.createPattern(clouds,'repeat'); pat.setTransform(new DOMMatrix().translate(((o.x%512)+512)%512,((o.y%512)+512)%512));
  g.fillStyle=pat; g.fillRect(0,0,size.x,size.y);
  const mpp=40075016.686*Math.cos(map.getCenter().lat*Math.PI/180)/Math.pow(2,map.getZoom()+8);
  const r=Math.max(REVEAL_M/mpp,3), b=map.getBounds().pad(.1);
  g.globalCompositeOperation='destination-out';
  for(const k of cells){ const [a,lo]=cellCenter(k); if(a<b.getSouth()||a>b.getNorth()||lo<b.getWest()||lo>b.getEast()) continue; const p=map.latLngToContainerPoint([a,lo]); g.drawImage(brush,p.x-r,p.y-r,r*2,r*2); }
}
map.on('move zoom resize viewreset',drawFog);

/* ---- trails ---- */
const trailLayer=L.layerGroup().addTo(map);
let liveLine=null, liveGlow=null;
function lighten(h){ const n=parseInt(h.slice(1),16),r=n>>16,g=(n>>8)&255,b=n&255,m=c=>Math.round(c+(255-c)*.45); return '#'+[m(r),m(g),m(b)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function darken(h){ const n=parseInt(h.slice(1),16),f=c=>Math.round(c*.58); return '#'+[f(n>>16),f((n>>8)&255),f(n&255)].map(x=>x.toString(16).padStart(2,'0')).join(''); }
function lineFor(pts,live,color,onClick){
  const c=color||me.color||'#d6b98c';
  const glow=L.polyline(pts,{pane:'trails',color:live===true?'#a9d1b2':c,weight:14,opacity:.45,lineCap:'round',lineJoin:'round',interactive:!!onClick,bubblingMouseEvents:false});
  if(onClick) glow.on('click',e=>{ L.DomEvent.stop(e); if(drawing) addDrawPt(e.latlng); else if(placing) placeAt(e.latlng); else onClick(); });
  const core=L.polyline(pts,{pane:'trails',color:live===true?'#4f7d5b':darken(c),weight:4,opacity:1,lineCap:'round',lineJoin:'round',interactive:false,dashArray:live===2?'1 9':null});
  return [glow,core];
}
function drawTrails(){
  trailLayer.clearLayers(); liveLine=liveGlow=null;
  if(!settings.trails) return;
  for(const w of fwalks) if(w.pts.length>1){ const f=friends[w.from]; lineFor(w.pts,2,f&&f.color,()=>openWalk(w.id,w.from)).forEach(l=>l.addTo(trailLayer)); }
  for(const w of walks) if(w.pts.length>1) lineFor(w.pts,false,null,()=>openWalk(w.id)).forEach(l=>l.addTo(trailLayer));
  if(cur&&cur.pts.length>1){ [liveGlow,liveLine]=lineFor(cur.pts,true); liveGlow.addTo(trailLayer); liveLine.addTo(trailLayer); }
  renderRouteMarkers();
}

/* ---- place markers ---- */
const markers={};
let lastPos=null;
function pinHtml(p){
  const t=teasers[p.id], img=(t&&t.photos&&t.photos[0])||covers[p.id];
  const near=lastPos&&!visits[p.id]&&dist(lastPos[0],lastPos[1],p.lat,p.lng)<=NEAR_M;
  const cls='pin'+(visits[p.id]?' done':'')+(near?' near':'');
  const bg=img?`background-image:url('${img}');`:'';
  return `<div class="${cls}"><div class="c" style="${bg}border-color:${visits[p.id]?'':CATS[p.cat].c}">${img?'':CATS[p.cat].ic}</div><div class="l">${esc(p.name)}</div></div>`;
}
function renderMarkers(){
  for(const p of places()){
    const icon=L.divIcon({html:pinHtml(p),className:'',iconSize:[38,38],iconAnchor:[19,19]});
    if(markers[p.id]) markers[p.id].setIcon(icon);
    else markers[p.id]=L.marker([p.lat,p.lng],{icon,riseOnHover:true}).addTo(map).on('click',e=>drawing?addDrawPt(e.latlng):openPlace(p.id));
  }
  for(const id in markers) if(!placeById(id)){ map.removeLayer(markers[id]); delete markers[id]; }
}

/* ================= Teasers (Wikipedia / Wikimedia Commons) ================= */
const loading={};
async function fetchTeaser(p,force){
  if(!force&&teasers[p.id]) return teasers[p.id];
  if(loading[p.id]) return loading[p.id];
  const q=p.q||(p.name+' Damascus');
  const words=(p.custom?p.name:p.q||p.name).toLowerCase().split(/[^a-z\u0600-\u06ff0-9]+/).filter(w=>w.length>=4&&w!=='damascus');
  const rel=t=>!p.custom||!words.length||words.some(w=>String(t||'').toLowerCase().includes(w));
  loading[p.id]=(async()=>{
    const out={photos:[],extract:'',url:''};
    try{
      const u='https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=10&prop=imageinfo&iiprop=url|mime&iiurlwidth=800&gsrsearch='+encodeURIComponent(q);
      const j=await (await fetch(u)).json();
      const pages=Object.values((j.query&&j.query.pages)||{}).sort((a,b)=>a.index-b.index);
      for(const pg of pages){ const ii=pg.imageinfo&&pg.imageinfo[0]; if(ii&&/jpeg|png|webp/.test(ii.mime)&&ii.thumburl&&rel(pg.title)) out.photos.push(ii.thumburl); if(out.photos.length>=5) break; }
    }catch(e){}
    try{
      const u='https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrlimit=1&prop=extracts|pageimages|info&inprop=url&exintro=1&explaintext=1&exsentences=4&piprop=thumbnail&pithumbsize=800&gsrsearch='+encodeURIComponent(q);
      const j=await (await fetch(u)).json();
      const pg=Object.values((j.query&&j.query.pages)||{})[0];
      if(pg&&rel(pg.title)){ out.extract=pg.extract||''; out.url=pg.fullurl||''; if(pg.thumbnail&&pg.thumbnail.source&&!out.photos.includes(pg.thumbnail.source)) out.photos.unshift(pg.thumbnail.source); }
    }catch(e){}

/* ================= Walking ================= */
let watchId=null, meMk=null, acc=null, wake=null, follow=true, cur=LS.get('ud_curwalk',null), lastFix=null, liveT=null;
if(cur){ if(cur.pts&&cur.pts.length>1) walks.push(finalize(cur)); cur=null; LS.set('ud_walks',walks); LS.set('ud_curwalk',null); }
function finalize(w){ w.end=w.end||w.last||Date.now(); delete w.last; return w; }
function revealR(lat,lng,Rm){ let n=0; const s=Math.ceil(Rm/15); for(let i=-s;i<=s;i++) for(let j=-s;j<=s;j++){ const a=lat+i*CELL,o=lng+j*CELL; if(dist(lat,lng,a,o)>Rm*.6) continue; const k=key(a,o); if(!cells.has(k)){cells.add(k);n++;} } return n; }
function revealPath(pts){ let n=0; for(let i=0;i<pts.length;i++){ const [a,o]=pts[i]; if(i){ const [pa,po]=pts[i-1]; const d=dist(pa,po,a,o); if(d<2000){ const m=Math.max(1,Math.ceil(d/10)); for(let s=1;s<=m;s++) n+=reveal(pa+(a-pa)*s/m,po+(o-po)*s/m); continue; } } n+=reveal(a,o); } return n; }
function reveal(lat,lng){ let n=0; const s=Math.ceil(REVEAL_M/15); for(let i=-s;i<=s;i++) for(let j=-s;j<=s;j++){ const a=lat+i*CELL,o=lng+j*CELL; if(dist(lat,lng,a,o)>REVEAL_M*.6) continue; const k=key(a,o); if(!cells.has(k)){cells.add(k);n++;} } return n; }
const saveCur=debounce(()=>LS.set('ud_curwalk',cur),3000);
function onFix(pos){
  const {latitude:lat,longitude:lng,accuracy:ac}=pos.coords;
  if(ac>MAX_ACC){ setGps('wait',`±${Math.round(ac)} m…`); return; }
  setGps('ok',`±${Math.round(ac)} m`);
  let added=0;
  if(lastFix){ const d=dist(lastFix[0],lastFix[1],lat,lng);
    if(d<400){ const n=Math.max(1,Math.ceil(d/10)); for(let s=1;s<=n;s++) added+=reveal(lastFix[0]+(lat-lastFix[0])*s/n,lastFix[1]+(lng-lastFix[1])*s/n); }
    else added+=reveal(lat,lng);
  } else added+=reveal(lat,lng);
  // trail
  if(cur){
    const lp=cur.pts[cur.pts.length-1];
    const d=lp?dist(lp[0],lp[1],lat,lng):Infinity;
    if(!lp||d>=MIN_STEP){
      if(lp&&d<400) cur.dist+=d;
      cur.pts.push([+lat.toFixed(5),+lng.toFixed(5)]); cur.last=Date.now(); (cur.tms=cur.tms||[]).push(Date.now());
      if(settings.trails){ if(liveLine){ liveLine.addLatLng([lat,lng]); liveGlow.addLatLng([lat,lng]); } else if(cur.pts.length>1) drawTrails(); }
      saveCur();
    }
  }
  lastFix=[lat,lng]; lastPos=[lat,lng];
  if(!meMk){ meMk=L.marker([lat,lng],{icon:L.divIcon({html:'<div class="me"></div>',className:'',iconSize:[20,20],iconAnchor:[10,10]}),zIndexOffset:2000}).addTo(map); acc=L.circle([lat,lng],{radius:ac,color:'#4ea3ff',weight:1,fillOpacity:.07,interactive:false}).addTo(map); }
  else { meMk.setLatLng([lat,lng]); acc.setLatLng([lat,lng]).setRadius(ac); }
  if(follow) map.panTo([lat,lng],{animate:false});
  if(added){ saveCells(); drawFog(); }
  renderHud(); renderMarkers(); renderLive();
  for(const p of places()){ if(visits[p.id]||p._nudged) continue; if(dist(lat,lng,p.lat,p.lng)<=NEAR_M){ p._nudged=true; vibrate(200); toast(`${CATS[p.cat].ic} You're at ${p.name}. Tap it to start the shot list!`); } }
}
function onErr(e){ if(e.code===1){ setGps('err','Denied'); toast('Location permission denied. Enable it in Chrome settings.'); stopWalk(true); } else setGps('wait','Searching…'); }

async function compress(file){ const u=URL.createObjectURL(file); try{ const img=await new Promise((res,rej)=>{const im=new Image(); im.onload=()=>res(im); im.onerror=rej; im.src=u;}); const s=Math.min(1,1400/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*s); c.height=Math.round(img.height*s); c.getContext('2d').drawImage(img,0,0,c.width,c.height); return c.toDataURL('image/jpeg',.82); } finally{ URL.revokeObjectURL(u); } }

async function onPhoto(e){

async function exportData(){
  const payload={app:'unfog-damascus',v:2,at:new Date().toISOString(),cells:[...cells],visits,shots,custom,walks,me,friends,fwalks,fshots,covers,album,logged,rphotos,photos:await allPhotos()};
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([JSON.stringify(payload)],{type:'application/json'}));
  a.download='unfog-damascus-'+new Date().toISOString().slice(0,10)+'.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  toast('Backup saved to Downloads');
}
async function importData(f){
  let p; try{ p=JSON.parse(await f.text()); }catch(e){ toast('That file is not a valid backup'); return; }
  if(p.app==='unfog-walk') return importWalk(p);
  try{ if(p.app!=='unfog-damascus') throw 0;
    (p.cells||[]).forEach(c=>cells.add(c)); Object.assign(visits,p.visits||{}); Object.assign(shots,p.shots||{});
    for(const c of (p.custom||[])) if(!custom.find(x=>x.id===c.id)) custom.push(c);
    for(const w of (p.walks||[])) if(!walks.find(x=>x.id===w.id)) walks.push(w);
    for(const k in (p.photos||{})) await putPhoto(k,p.photos[k]);
    if(p.me&&p.me.id===me.id) Object.assign(me,p.me);
    Object.assign(friends,p.friends||{}); for(const w of (p.fwalks||[])) if(!fwalks.find(x=>x.id===w.id&&x.from===w.from)) fwalks.push(w);
    Object.assign(fshots,p.fshots||{}); Object.assign(covers,p.covers||{}); Object.assign(album,p.album||{}); Object.assign(logged,p.logged||{}); Object.assign(rphotos,p.rphotos||{}); LS.set('ud_rphotos',rphotos); LS.set('ud_album',album); LS.set('ud_logged',logged);
    LS.set('ud_me',me); LS.set('ud_friends',friends); LS.set('ud_fwalks',fwalks); LS.set('ud_fshots',fshots); LS.set('ud_covers',covers);
    LS.set('ud_cells',[...cells]); LS.set('ud_visits',visits); LS.set('ud_shots',shots); LS.set('ud_custom2',custom); LS.set('ud_walks',walks);
    drawFog(); drawTrails(); renderMarkers(); renderHud(); renderStats(); toast('Backup restored');
  }catch(e){ toast('That file is not a valid backup'); }
}

let searchRes=[], searchPin=null, sT=null, sSeq=0;
const DAM_BOX='36.18,33.58,36.42,33.44'; // west,north,east,south
function guessCat(c,t){ const k=(c+':'+t).toLowerCase();
  if(/cafe|restaurant|fast_food|ice_cream|bakery|confectionery|food|pastry|juice/.test(k)) return 'food';
  if(/place_of_worship|mosque|church|monastery|shrine|religious/.test(k)) return 'faith';
  if(/park|garden|nature|forest/.test(k)) return 'parks';
  if(/marketplace|market|bazaar|mall|souq/.test(k)) return 'souq';
  if(/museum|historic|castle|monument|memorial|ruins|archaeolog|palace|city_gate|attraction|gallery/.test(k)) return 'heritage';
  if(/viewpoint|peak|mountain/.test(k)) return 'views';
  if(/suburb|neighbourhood|quarter|residential/.test(k)) return 'quarter';
  return 'mine'; }
function openSearch(){
  openSheet(`<div class="grab"></div><div class="sh"><h2>🔍 Find a place</h2>
    <input class="f" id="sq" placeholder="Café, mosque, street… (English or عربي)" autocomplete="off" style="margin-top:10px">
    <div id="sOut"><p style="color:var(--muted);font-size:13px">Searches your places and all of Damascus on OpenStreetMap.</p></div>
    <div class="row"><button class="btn" data-a="close">Close</button></div></div>`);
  const i=$('sq'); setTimeout(()=>i.focus(),250);
  i.oninput=()=>{ clearTimeout(sT); sT=setTimeout(()=>runSearch(i.value.trim()),550); };
  i.onkeydown=e=>{ if(e.key==='Enter'){ clearTimeout(sT); runSearch(i.value.trim()); } };
}
async function runSearch(q){
  const out=$('sOut'); if(!out) return;
  if(q.length<2){ out.innerHTML=''; return; }
  const seq=++sSeq, ql=q.toLowerCase();

async function shareWalk(w){
  if(!me.name){ pendingShare=w; toast('First, set your name'); openProfile(); return; }
  const all=await allPhotos(); const photos={}, meta={};
  for(const k in shots){ if(shots[k]>=w.start&&shots[k]<=(w.end||Date.now())+60000&&all[k]){ photos[k]=all[k]; const [pid,i]=k.split('#'); const p=placeById(pid); meta[k]={pid,label:p?p.shots[+i]:'',ts:shots[k]}; } }
  for(const k in album){ const al=album[k]; const inWin=(al.ts>=w.start&&al.ts<=(w.end||Date.now())+60000)||(w.manual&&w.places&&w.places.includes(al.pid)); if(inWin&&all[k]){ photos[k]=all[k]; meta[k]={pid:al.pid,label:'Album',ts:al.ts}; } }
  for(const k in rphotos){ const rp=rphotos[k]; if(rp.wid===w.id&&!rp.from&&all[k]){ photos[k]=all[k]; meta[k]={route:true,lat:rp.lat,lng:rp.lng,ts:rp.ts}; } }
  const pids=new Set(Object.values(meta).filter(m=>!m.route).map(m=>m.pid));
  const placesOut=custom.filter(p=>pids.has(p.id));
  const payload={ app:'unfog-walk', v:1, from:{id:me.id,name:me.name,emoji:me.emoji,color:me.color}, walk:{id:w.id,start:w.start,end:w.end,dist:w.dist,pts:w.pts,tms:w.tms,manual:w.manual,with:w.with||[]}, meta, photos, places:placesOut };
  const fname=`walk-${me.name.replace(/[^\w؀-ۿ]+/g,'-')}-${new Date(w.start).toISOString().slice(0,10)}`;
  const text=JSON.stringify(payload);
  for(const [ext,type] of [['.json','application/json'],['.txt','text/plain']]){
    try{ const file=new File([text],fname+ext,{type}); if(navigator.canShare&&navigator.canShare({files:[file]})){ await navigator.share({files:[file],title:'Unfog walk',text:`${me.emoji} My Unfog walk: ${fmtD(w.dist)}. Open Unfog → Stats → Import.`}); return; } }catch(e){ if(e&&e.name==='AbortError') return; }
  }
  const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'application/json'})); a.download=fname+'.json'; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  toast('Walk saved to Downloads. Send it to your friend.');
}
async function importWalk(p){
  try{
    const f=p.from; if(!f||!p.walk) throw 0;
    if(f.id===me.id){ toast("That's your own walk 🙂"); return; }
    friends[f.id]=Object.assign(friends[f.id]||{},{id:f.id,name:f.name,emoji:f.emoji,color:f.color});
    // merge a locally-tagged companion with the same name
    for(const id in friends){ if(friends[id].local&&friends[id].name.trim().toLowerCase()===String(f.name).trim().toLowerCase()) delete friends[id]; }
    if(fwalks.find(x=>x.id===p.walk.id&&x.from===f.id)){ toast('You already have this walk'); return; }
    const w=Object.assign({},p.walk,{from:f.id}); fwalks.push(w);
    const before=cells.size;
    revealPath(w.pts);
    for(const pl of (p.places||[])) if(!placeById(pl.id)) custom.push(Object.assign({},pl,{sharedBy:f.name}));
    let np=0;
    for(const k in (p.photos||{})){ const nk='f:'+f.id+':'+k; await putPhoto(nk,p.photos[k]); const m=(p.meta||{})[k]||{};
      if(m.route){ rphotos[nk]={wid:w.id,lat:m.lat,lng:m.lng,ts:m.ts||w.start,from:f.id}; try{ await putPhoto(nk+':t',await thumb(p.photos[k])); }catch(e){} np++; continue; } fshots[nk]={pid:m.pid||k.split('#')[0],from:f.id,label:m.label||'',ts:m.ts||w.start}; if(m.pid&&placeById(m.pid)&&!visits[m.pid]){ visits[m.pid]=m.ts||w.start; } np++; }
    LS.set('ud_rphotos',rphotos); LS.set('ud_friends',friends); LS.set('ud_fwalks',fwalks); LS.set('ud_fshots',fshots); LS.set('ud_custom2',custom); LS.set('ud_visits',visits); LS.set('ud_cells',[...cells]);
    drawFog(); drawTrails(); renderMarkers(); renderHud(); if(curPage==='stats') renderStats();
    go('map'); follow=false; if(w.pts.length>1) map.fitBounds(L.latLngBounds(w.pts),{padding:[60,60]});
    openSheet(`<div class="grab"></div><div class="sh"><h2>${esc(f.emoji)} Walk from ${esc(f.name)}</h2>
      <div class="sumgrid"><div><b>${fmtD(w.dist||0)}</b><span>distance</span></div><div><b>${cells.size-before}</b><span>tiles for you</span></div><div><b>${np}</b><span>photos</span></div></div>
      <p>Their trail is now on your map in their colour, and the fog it cleared counts for you too.</p>
      <div class="row"><button class="btn pri" data-a="close">Nice</button></div></div>`);
  }catch(e){ toast('That shared walk could not be read'); }
}

/* ---- EXIF: capture time + GPS from the original file ---- */
async function readExif(file){
  try{
    const buf=await file.slice(0,262144).arrayBuffer(), v=new DataView(buf);
    if(v.getUint16(0)!==0xFFD8) return {};
    let o=2;
    while(o<v.byteLength-4){
      const mk=v.getUint16(o), len=v.getUint16(o+2);
      if(mk===0xFFE1&&v.getUint32(o+4)===0x45786966){ return parseTiff(v,o+10); }
      if((mk&0xFF00)!==0xFF00) break; o+=2+len;
    }
  }catch(e){}
  return {};
}
function parseTiff(v,t){
  const le=v.getUint16(t)===0x4949, u16=x=>v.getUint16(x,le), u32=x=>v.getUint32(x,le);
  const ifd=(off)=>{ const n=u16(t+off), out={}; for(let i=0;i<n;i++){ const e=t+off+2+i*12; out[u16(e)]={type:u16(e+2),count:u32(e+4),val:e+8}; } return out; };
  const str=en=>{ const p=en.count>4?t+u32(en.val):en.val; let s=''; for(let i=0;i<en.count-1;i++) s+=String.fromCharCode(v.getUint8(p+i)); return s; };
  const rats=en=>{ const p=t+u32(en.val), r=[]; for(let i=0;i<en.count;i++) r.push(u32(p+i*8)/(u32(p+i*8+4)||1)); return r; };
  const res={}; const i0=ifd(u32(t+4));
  if(i0[0x8769]){ const ex=ifd(u32(i0[0x8769].val)); const d=ex[0x9003]||ex[0x9004]; if(d){ const m=str(d).match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/); if(m) res.ts=new Date(+m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]).getTime(); } }
  if(i0[0x8825]){ const g=ifd(u32(i0[0x8825].val)); if(g[2]&&g[4]){ const la=rats(g[2]), lo=rats(g[4]); let lat=la[0]+la[1]/60+la[2]/3600, lng=lo[0]+lo[1]/60+lo[2]/3600;
    if(g[1]&&String.fromCharCode(v.getUint8(g[1].val))==='S') lat=-lat; if(g[3]&&String.fromCharCode(v.getUint8(g[3].val))==='W') lng=-lng; if(lat||lng){ res.lat=lat; res.lng=lng; } } }
  return res;
}
function nearestOnPath(pts,lat,lng){
  const k=Math.cos(lat*Math.PI/180); let best=null,bd=Infinity;
  for(let i=0;i<pts.length;i++){
    const a=pts[i], b=pts[i+1]||pts[i];
    const ax=a[1]*k, ay=a[0], bx=b[1]*k, by=b[0], px=lng*k, py=lat;
    const dx=bx-ax, dy=by-ay, L2=dx*dx+dy*dy; let tt=L2?((px-ax)*dx+(py-ay)*dy)/L2:0; tt=Math.max(0,Math.min(1,tt));
    const q=[ay+dy*tt,(ax+dx*tt)/k], d=dist(lat,lng,q[0],q[1]); if(d<bd){ bd=d; best=q; }
  }
  return {pt:best,d:bd};
}
function posAtTime(w,T){
  if(!w.tms||w.tms.length!==w.pts.length||!T) return null;
  const t0=w.tms[0], t1=w.tms[w.tms.length-1];
  if(T<t0-10*60000||T>t1+10*60000) return null;
  if(T<=t0) return w.pts[0]; if(T>=t1) return w.pts[w.pts.length-1];
  for(let i=1;i<w.tms.length;i++) if(w.tms[i]>=T){ const f=(T-w.tms[i-1])/((w.tms[i]-w.tms[i-1])||1), a=w.pts[i-1], b=w.pts[i]; return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]; }
  return null;
}
function pathAt(pts,frac){ // point at fraction of the route's length
  let total=0; const seg=[]; for(let i=1;i<pts.length;i++){ const d=dist(pts[i-1][0],pts[i-1][1],pts[i][0],pts[i][1]); seg.push(d); total+=d; }
  let target=total*frac; for(let i=0;i<seg.length;i++){ if(target<=seg[i]){ const f=seg[i]?target/seg[i]:0, a=pts[i], b=pts[i+1]; return [a[0]+(b[0]-a[0])*f,a[1]+(b[1]-a[1])*f]; } target-=seg[i]; }
  return pts[pts.length-1];
}
$('fileRoute').onchange=async e=>{
  const fs=[...(e.target.files||[])]; e.target.value=''; const w=pendingRoute; pendingRoute=null; if(!fs.length||!w) return;

      const ex=await readExif(f), data=await compress(f);
      let pos=null, how='';

      if(!pos&&ex.ts){ const q=posAtTime(w,ex.ts); if(q){ pos=q; how='time'; } }
      if(pos){ await saveRoutePhoto(w.id,data,pos[0],pos[1],ex.ts||Date.now()); auto++; }
      else manual.push({data,ts:ex.ts||w.start,thumb:await thumb(data)});
    }catch(err){}

};

/* ================= Draw a path ================= */
let drawing=null, drawGlow=null, drawCore=null, drawDots=null;
function drawDist(){ let d=0; for(let i=1;i<(drawing||[]).length;i++) d+=dist(drawing[i-1][0],drawing[i-1][1],drawing[i][0],drawing[i][1]); return d; }
function renderDraw(){
  if(!drawing) return;
  if(!drawGlow){ drawGlow=L.polyline([], {pane:'trails',color:me.color,weight:12,opacity:.3,lineCap:'round',interactive:false}).addTo(map); drawCore=L.polyline([], {pane:'trails',color:darken(me.color),weight:4,dashArray:'8 8',lineCap:'round',interactive:false}).addTo(map); drawDots=L.layerGroup().addTo(map); }
  drawGlow.setLatLngs(drawing); drawCore.setLatLngs(drawing); drawDots.clearLayers();
  drawing.forEach((pt,i)=>L.circleMarker(pt,{radius:i===drawing.length-1?6:3.5,color:'#fff',weight:2,fillColor:me.color,fillOpacity:1,interactive:false}).addTo(drawDots));
  $('drawTxt').innerHTML=drawing.length?`✏️ ${drawing.length} point${drawing.length>1?'s':''} · ${fmtD(drawDist())}<small>Keep tapping along your route. Save when you're done.</small>`
    :`✏️ Tap along the streets you took<small>Each tap adds a point. Follow the streets, not straight across blocks.</small>`;
  $('dSave').disabled=drawing.length<2; $('dUndo').disabled=!drawing.length;
}
function addDrawPt(ll){ if(!drawing) return; drawing.push([+ll.lat.toFixed(5),+ll.lng.toFixed(5)]); renderDraw(); }
function startDraw(){
  if(watchId!==null){ toast('End your live walk first'); return; }
  drawing=[]; go('map'); closeSheet(); $('drawBar').classList.add('show'); $('walkWrap').style.display='none'; $('tDraw').classList.add('on');
  $('tDraw').style.background='var(--gold)'; renderDraw(); toast('Tap the map along the route you walked');
}
function endDraw(){
  drawing=null; [drawGlow,drawCore,drawDots].forEach(l=>l&&map.removeLayer(l)); drawGlow=drawCore=drawDots=null;
  $('drawBar').classList.remove('show'); $('walkWrap').style.display=''; $('tDraw').style.background='';
}
function cancelDraw(){ endDraw(); toast('Drawing cancelled'); }
map.on('click',e=>{ if(drawing) addDrawPt(e.latlng); });
$('dUndo').onclick=()=>{ if(drawing&&drawing.length){ drawing.pop(); renderDraw(); } };
$('dCancel').onclick=cancelDraw;
$('dSave').onclick=()=>{ if(!drawing||drawing.length<2) return;
  openSheet(`<div class="grab"></div><div class="sh"><h2>✏️ Save path</h2><p>${fmtD(drawDist())} drawn</p>
    <label class="f">When did you walk it?</label><input class="f" type="date" id="drawDate" value="${todayStr()}" max="${todayStr()}">
    <div class="row"><button class="btn pri" data-a="drawsave">Save path</button><button class="btn" data-a="close">Keep drawing</button></div></div>`); };
function saveDraw(ts){
  if(!drawing||drawing.length<2) return;
  const pts=drawing.slice(), d=drawDist();
  const near=places().filter(p=>pts.some(pt=>dist(pt[0],pt[1],p.lat,p.lng)<=NEAR_M)).map(p=>p.id);
  const w={ id:'m'+Date.now(), manual:true, start:ts, end:ts+Math.round(d/1.2)*1000, pts, dist:d, with:[], places:near };
  const before=cells.size; revealPath(pts);
  walks.push(w); LS.set('ud_walks',walks); LS.set('ud_cells',[...cells]);
  endDraw(); closeSheet(); drawFog(); drawTrails(); renderHud();
  toast(`✏️ Path saved · ${fmtD(d)} · +${cells.size-before} tiles`);
}

/* ================= Boot ================= */
syncTools(); drawFog(); drawTrails(); renderMarkers(); renderHud();
openDB();
if(!window.isSecureContext) setTimeout(()=>toast('Open from an https:// link to use GPS'),800);
setTimeout(warmTeasers,600);
if(!LS.get('ud_seen2',false)){ LS.set('ud_seen2',true); setTimeout(()=>openSheet(`<div class="grab"></div><div class="sh"><h2>🌫️ Unfog Damascus</h2>
  <p>The city is covered in mist. Walk to clear it: every street you take stays lit, and every walk leaves a glowing trail.</p>
  <p>📍 Tap a place to see its story, the best time to go, and its <b>shot list</b>. Get there, take the shots, and earn XP.</p>
  <p>⭐ <b>Long-press</b> anywhere on the map to add your own place.</p>
  <div class="row"><button class="btn pri" data-a="close">Let's go</button></div></div>`),900); }
})();
</script>
</body>
</html>
